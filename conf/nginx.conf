server {
  listen 80;
  server_name localhost;

  # The root directory where your Angular app is copied
  root /usr/share/nginx/html;
  index index.html;

  # This location block is the key for SPA routing
  location / {
    # Tells Nginx to try serving the exact file requested, else falls back to serving /index.html.
    try_files $uri $uri/ /index.html;
  }

  # Enable Gzip compression to make the app load faster for users.
  gzip on;
  gzip_proxied any;
  gzip_comp_level 5;
  gzip_types text/plain text/css application/json application/javascript text/xml;
}