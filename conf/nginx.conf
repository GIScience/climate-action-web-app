server {
  listen 80;
  server_name localhost;

  # The root directory where your Angular app is copied
  root /usr/share/nginx/html;
  index index.html;

  # Legacy URL redirect: /webapp/* → /*
  rewrite ^/webapp/?(.*)$ /$1 permanent;

  # Don't cache index.html, env.js, or JSON runtime data
  location ~* (?:index\.html|env\.js|\.json)$ {
    expires -1;
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    try_files $uri =404;
  }

  # mime.types lacks .mjs and module scripts (maplibre's worker) need a JS MIME type.
  # Not in the 1y-cache block below: the files are unhashed, immutable breaks upgrades.
  location ~* \.mjs$ {
    default_type text/javascript;
    add_header Cache-Control "no-cache";
    try_files $uri =404;
  }

  # Cache hashed assets (JS, CSS, fonts, images) for 1 year
  location ~* \.(?:css|js|woff2?|ttf|eot|ico|svg|png|jpg|jpeg|gif|webp)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # SPA routing fallback
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Serve precompressed .gz files (created at build time)
  gzip_static on;

  # Fallback for files without a precompressed .gz (e.g. env.js)
  gzip on;
  gzip_proxied any;
  gzip_comp_level 5;
  gzip_vary on;
  gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
}