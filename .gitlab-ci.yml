test:
  stage: test
  image:
    name: trion/ng-cli-e2e:17.0.0
  cache:
    paths:
      - node_modules
  before_script:
    - npm install
  script:
    - npm run lint
    - npm test --no-progress --browsers=Chrome --watch=false --code-coverage
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage/cobertura-coverage.xml

docker_build_deploy:
  stage: deploy
  only:
    - main
  image:
    name: gcr.io/kaniko-project/executor:v1.14.0-debug
    entrypoint: [ "" ]
  script:
    - mkdir -p /kaniko/.docker
    - echo "{\"auths\":{\"https://index.docker.io/v1/\":{\"auth\":\"$(printf "%s:%s" "${CI_DOCKER_USER}" "${CI_DOCKER_TOKEN}" | base64 | tr -d '\n')\"}}}}" > /kaniko/.docker/config.json
    - >
      if [ -z ${CI_COMMIT_TAG+x} ]; then
        /kaniko/executor \
          --context "${CI_PROJECT_DIR}" \
          --dockerfile "${CI_PROJECT_DIR}/Dockerfile" \
          --build-arg BUILD_TARGET=staging \
          --destination "docker.io/heigit/ca-${CI_PROJECT_NAME}:devel"
      else
        /kaniko/executor \
          --context "${CI_PROJECT_DIR}" \
          --dockerfile "${CI_PROJECT_DIR}/Dockerfile" \
          --build-arg BUILD_TARGET=prod \
          --destination "docker.io/heigit/ca-${CI_PROJECT_NAME}:${CI_COMMIT_TAG}"
      fi

