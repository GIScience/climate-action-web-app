stages:
  - test
  - deploy

cache:
  key: $CI_COMMIT_REF_NAME
  paths:
    - node_modules

test_jasmine:
  stage: test
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  image:
    name: trion/ng-cli-e2e:17.0.0
  before_script:
    - npm install
  script:
    - npm run lint
    - npm test --no-progress --browsers=Chrome --watch=false --code-coverage
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage/cobertura-coverage.xml

test_cypress:
  stage: test
  variables:
    NODE_ENV: 'test'
  needs: ["test_jasmine"]
  image:
    name: cypress/included:10.6.0
  script:
    - npm run cy:run
  artifacts:
    when: always
    paths:
      - cypress/screenshots
      - cypress/videos
      - cypress/reports

docker_build_deploy_development:
  stage: deploy
  cache: []
  rules:
    - if: $CI_COMMIT_BRANCH == "main" && $CI_PIPELINE_SOURCE == 'push'
  image:
    name: gcr.io/kaniko-project/executor:v1.14.0-debug
    entrypoint: [ "" ]
  before_script:
    - mkdir -p /kaniko/.docker
    - echo "{\"auths\":{\"https://index.docker.io/v1/\":{\"auth\":\"$(printf "%s:%s" "${CI_DOCKER_USER}" "${CI_DOCKER_TOKEN}" | base64 | tr -d '\n')\"}}}}" > /kaniko/.docker/config.json
  script:
    - >
      /kaniko/executor \
          --context "${CI_PROJECT_DIR}" \
          --dockerfile "${CI_PROJECT_DIR}/Dockerfile" \
          --cache \
          --cache-repo "docker.io/heigit/ca-${CI_PROJECT_NAME}-cache" \
          --cache-copy-layers \
          --build-arg BUILD_TARGET=dev \
          --destination "docker.io/heigit/ca-${CI_PROJECT_NAME}:devel" \
          --cleanup
      /kaniko/executor \
          --context "${CI_PROJECT_DIR}" \
          --dockerfile "${CI_PROJECT_DIR}/Dockerfile" \
          --cache \
          --cache-repo "docker.io/heigit/ca-${CI_PROJECT_NAME}-cache" \
          --cache-copy-layers \
          --build-arg BUILD_TARGET=staging \
          --destination "docker.io/heigit/ca-${CI_PROJECT_NAME}:staging" \
          --cleanup

docker_build_deploy_release:
  stage: deploy
  cache: []
  rules:
    - if: $CI_COMMIT_TAG
  image:
    name: gcr.io/kaniko-project/executor:v1.14.0-debug
    entrypoint: [ "" ]
  before_script:
    - mkdir -p /kaniko/.docker
    - echo "{\"auths\":{\"https://index.docker.io/v1/\":{\"auth\":\"$(printf "%s:%s" "${CI_DOCKER_USER}" "${CI_DOCKER_TOKEN}" | base64 | tr -d '\n')\"}}}}" > /kaniko/.docker/config.json
  script:
    - >
      /kaniko/executor \
          --context "${CI_PROJECT_DIR}" \
          --dockerfile "${CI_PROJECT_DIR}/Dockerfile" \
          --build-arg BUILD_TARGET=prod \
          --destination "docker.io/heigit/ca-${CI_PROJECT_NAME}:${CI_COMMIT_TAG}" \
          --cleanup