stages:
    - test
    - build
    - deploy

variables:
    PNPM_STORE_PATH: '$CI_PROJECT_DIR/.pnpm-store'
    PNPM_VERSION: '11.13.0'

test_jest_and_lint:
    stage: test
    rules:
        - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TITLE !~ /^(Draft|WIP)/i'
        - when: never
    cache:
        key:
            files:
                - pnpm-lock.yaml
        paths:
            - .pnpm-store
            - .jest-cache
        policy: pull-push
    image:
        name: node:22-alpine
    variables:
        NODE_OPTIONS: '--no-warnings'
        CYPRESS_INSTALL_BINARY: '0'
    before_script:
        - |
            cat > "./src/assets/env.js" << EOF
            ;(function (window) {
                window.env = window.env || {}
                window['env']['ENVIRONMENT_TYPE'] = 'testing'
            })(this)
            EOF
        - npm install -g pnpm@${PNPM_VERSION}
        - pnpm config set store-dir .pnpm-store
        - pnpm install --frozen-lockfile --prefer-offline
        - pnpm store prune
    script:
        - pnpm lint
        - pnpm test:coverage
    artifacts:
        reports:
            coverage_report:
                coverage_format: cobertura
                path: coverage/cobertura-coverage.xml

test_cypress:
    stage: test
    rules:
        - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TITLE !~ /^(Draft|WIP)/i'
        - when: never
    cache:
        key:
            files:
                - pnpm-lock.yaml
        paths:
            - .pnpm-store
    variables:
        NODE_ENV: 'test'
        NODE_OPTIONS: '--no-warnings'
        CYPRESS_INSTALL_BINARY: '0'
    needs: ['test_jest_and_lint']
    image:
        name: cypress/included:cypress-15.21.1-node-24.20.0-chrome-152.0.7977.64-1-ff-154.0.1-edge-151.0.4129.107-1
        entrypoint: ['']
    before_script:
        - |
            cat > "./src/assets/env.js" << EOF
            ;(function (window) {
                window.env = window.env || {}
                window['env']['ENVIRONMENT_TYPE'] = 'testing'
                window['env']['GEOCODE_API_KEY'] = '${GEOCODE_API_KEY}'
            })(this)
            EOF
        - npm install -g pnpm@${PNPM_VERSION}
        - pnpm config set store-dir .pnpm-store
        - pnpm install --frozen-lockfile --prefer-offline
        - pnpm store prune
    script:
        - pnpm start &
        - pnpm wait-on http://localhost:4200
        - pnpm cy:run
    artifacts:
        when: on_failure
        paths:
            - cypress/screenshots/**/*.png
            - cypress/snapshots/actual/**/*.png
            - cypress/snapshots/diff/**/*.png
        expire_in: 7 day

build_staging:
    stage: build
    cache: []
    rules:
        - if: $CI_COMMIT_BRANCH == "main" && $CI_PIPELINE_SOURCE == 'push'
    image: docker.io/docker:29.7.2-cli
    services:
        - name: docker:29.7.2-dind
          alias: thedockerhost
    variables:
        DOCKER_HOST: tcp://thedockerhost:2375
        DOCKER_TLS_CERTDIR: ''
        DOCKER_DRIVER: overlay2
    before_script:
        - unset DOCKER_AUTH_CONFIG
        - echo ${CI_DOCKER_TOKEN} | docker --config ~/ca_config login ${REGISTRY_URL} -u ${CI_DOCKER_USER} --password-stdin
    script:
        - |
            docker --config ~/ca_config \
                build \
                --tag ${REGISTRY_URL}/${GROUP_NAME}/${CI_PROJECT_NAME}:staging \
                --tag ${REGISTRY_URL}/${GROUP_NAME}/${CI_PROJECT_NAME}:devel \
                .
        - docker --config ~/ca_config push ${REGISTRY_URL}/${GROUP_NAME}/${CI_PROJECT_NAME}:staging
        - docker --config ~/ca_config push ${REGISTRY_URL}/${GROUP_NAME}/${CI_PROJECT_NAME}:devel

build_release:
    stage: build
    cache: []
    rules:
        - if: $CI_COMMIT_TAG
    image: docker.io/docker:29.7.2-cli
    services:
        - name: docker:29.7.2-dind
          alias: thedockerhost
    variables:
        DOCKER_HOST: tcp://thedockerhost:2375
        DOCKER_TLS_CERTDIR: ''
        DOCKER_DRIVER: overlay2
    before_script:
        - unset DOCKER_AUTH_CONFIG
        - echo ${CI_DOCKER_TOKEN} | docker --config ~/ca_config login ${REGISTRY_URL} -u ${CI_DOCKER_USER} --password-stdin
    script:
        - |
            docker --config ~/ca_config \
                build \
                --platform=linux/amd64 \
                --tag ${REGISTRY_URL}/${GROUP_NAME}/${CI_PROJECT_NAME}:${CI_COMMIT_TAG} \
                .
        - docker --config ~/ca_config push ${REGISTRY_URL}/${GROUP_NAME}/${CI_PROJECT_NAME}:${CI_COMMIT_TAG}

deploy_staging:
    stage: deploy
    tags: [k8s-kta]
    needs:
        - build_staging
    rules:
        - !reference [build_staging, rules]
    image: repo.heigit.org/heigit/argocd-cli:latest
    script:
        - |
            argocd app actions \
              run ca-staging/${ARGOCD_STAGING_APPLICATION_NAME} \
              restart --kind Deployment \
              --server ${ARGOCD_SERVER} \
              --auth-token ${ARGOCD_AUTH_TOKEN}\
              --resource-name can-${CI_PROJECT_NAME}
