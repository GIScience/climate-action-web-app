stages:
    - test
    - build
    - deploy

cache:
    key:
        files:
            - pnpm-lock.yaml
        prefix: $CI_COMMIT_REF_NAME
    paths:
        - .pnpm-store

variables:
    PNPM_STORE_PATH: '$CI_PROJECT_DIR/.pnpm-store'

test_jest_and_lint:
    stage: test
    tags: []
    rules:
        - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TITLE !~ /^(Draft|WIP)/i'
        - when: never
    cache:
        key:
            files:
                - pnpm-lock.yaml
            prefix: $CI_COMMIT_REF_NAME
        paths:
            - .pnpm-store
            - .jest-cache
        policy: pull-push
    image:
        name: trion/ng-cli-karma:20.3.11
    variables:
        NODE_OPTIONS: '--no-warnings'
    before_script:
        - |
            cat > "./src/assets/env.js" << EOF
            ;(function (window) {
                window.env = window.env || {}
                window['env']['ENVIRONMENT_TYPE'] = 'testing'
            })(this)
            EOF
        - pnpm config set store-dir .pnpm-store
        - pnpm install --frozen-lockfile --prefer-offline
    script:
        - pnpm lint
        - pnpm test:coverage
    artifacts:
        reports:
            coverage_report:
                coverage_format: cobertura
                path: coverage/cobertura-coverage.xml

test_cypress:
    stage: test
    tags: []
    rules:
        - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TITLE !~ /^(Draft|WIP)/i'
        - when: never
    cache:
        key:
            files:
                - pnpm-lock.yaml
            prefix: $CI_COMMIT_REF_NAME
        paths:
            - .pnpm-store
            - .cache/Cypress
    variables:
        NODE_ENV: 'test'
        NODE_OPTIONS: '--no-warnings'
        CYPRESS_CACHE_FOLDER: '$CI_PROJECT_DIR/.cache/Cypress'
    needs: ['test_jest_and_lint']
    image:
        name: cypress/included:cypress-14.5.4-node-22.18.0-chrome-139.0.7258.66-1-ff-141.0.3-edge-138.0.3351.121-1
        entrypoint: ['']
    before_script:
        - |
            cat > "./src/assets/env.js" << EOF
            ;(function (window) {
                window.env = window.env || {}
                window['env']['ENVIRONMENT_TYPE'] = 'testing'
                window['env']['ORS_API_KEY'] = '${ORS_API_KEY}'
            })(this)
            EOF
        - npm install -g pnpm
        - pnpm config set store-dir .pnpm-store
        - pnpm install --frozen-lockfile --prefer-offline
        - mkdir -p .cache/Cypress
        - |
            if ls "$CYPRESS_CACHE_FOLDER"/*/Cypress >/dev/null 2>&1; then
              echo "Using cached Cypress binary"
            else
              pnpm exec cypress install
            fi
    script:
        - pnpm start & pnpm exec wait-on http://localhost:4200
        - pnpm cy:run
    artifacts:
        when: on_failure
        paths:
            - cypress/screenshots/**/*.png
            - cypress/snapshots/actual/**/*.png
            - cypress/snapshots/diff/**/*.png
        expire_in: 30 day

build_staging:
    stage: build
    tags: []
    cache: []
    rules:
        - if: $CI_COMMIT_BRANCH == "main" && $CI_PIPELINE_SOURCE == 'push'
    image: docker.io/docker:29.2.1-cli
    services:
        - name: docker:29.2.1-dind
          alias: thedockerhost
    variables:
        DOCKER_HOST: tcp://thedockerhost:2375
        DOCKER_TLS_CERTDIR: ''
        DOCKER_DRIVER: overlay2
    before_script:
        - apk add --no-cache git
        - echo ${CI_DOCKER_TOKEN} | docker --config ~/ca_config login ${REGISTRY_URL} -u ${CI_DOCKER_USER} --password-stdin
    script:
        - |
            docker --config ~/ca_config \
                build \
                --tag ${REGISTRY_URL}/${GROUP_NAME}/${CI_PROJECT_NAME}:staging \
                --tag ${REGISTRY_URL}/${GROUP_NAME}/${CI_PROJECT_NAME}:devel \
                .
        - docker --config ~/ca_config push ${REGISTRY_URL}/${GROUP_NAME}/${CI_PROJECT_NAME}:staging
        - docker --config ~/ca_config push ${REGISTRY_URL}/${GROUP_NAME}/${CI_PROJECT_NAME}:devel

build_release:
    stage: build
    tags: []
    cache: []
    rules:
        - if: $CI_COMMIT_TAG
    image: docker.io/docker:29.2.1-cli
    services:
        - name: docker:29.2.1-dind
          alias: thedockerhost
    variables:
        DOCKER_HOST: tcp://thedockerhost:2375
        DOCKER_TLS_CERTDIR: ''
        DOCKER_DRIVER: overlay2
    before_script:
        - apk add --no-cache git
        - echo ${CI_DOCKER_TOKEN} | docker --config ~/ca_config login ${REGISTRY_URL} -u ${CI_DOCKER_USER} --password-stdin
    script:
        - |
            docker --config ~/ca_config \
                build \
                --platform=linux/amd64 \
                --tag ${REGISTRY_URL}/${GROUP_NAME}/${CI_PROJECT_NAME}:${CI_COMMIT_TAG} \
                .
        - docker --config ~/ca_config push ${REGISTRY_URL}/${GROUP_NAME}/${CI_PROJECT_NAME}:${CI_COMMIT_TAG}

deploy_staging:
    stage: deploy
    tags: [k8s-kta]
    needs:
        - build_staging
    rules:
        - !reference [build_staging, rules]
    image: repo.heigit.org/heigit/argocd-cli:latest
    script:
        - |
            argocd app actions \
              run ca-staging/${ARGOCD_STAGING_APPLICATION_NAME} \
              restart --kind Deployment \
              --server ${ARGOCD_SERVER} \
              --auth-token ${ARGOCD_AUTH_TOKEN}\
              --resource-name can-${CI_PROJECT_NAME}
