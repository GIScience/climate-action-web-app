<div class="p-10 bgc-white bd">
    <div class="row">
        <div class="plugin-header mx-3">
            <h3 class="plugin-title">Plugins</h3>
            <div class="progress-bar"></div>
        </div>
        <div class="plugin-container">
            <button class="handle left-handle" (click)="onSlideClick('left')">
        <span class="w-5r bdrs-50p bdB pt-2" style="color: black;" aria-hidden="true">
          <i class="ti-angle-left"></i>
        </span>
            </button>
            <div class="slider">
                <div class="m-3 p-2" *ngFor="let plugin of plugins; let i = index;" style="cursor: pointer">
                    <mat-card class="plugin-card"
                              (click)="showPluginInfo(plugin.plugin_id)"
                              (keydown)="showPluginInfo(plugin.plugin_id)"
                              tabindex="{{i}}"
                              matTooltip="{{plugin.purpose}}">
                        <mat-card-header>
                            <mat-card-title>{{plugin.name}}</mat-card-title>
                            <mat-card-subtitle>ver. {{plugin.version}}/{{plugin.library_version}}</mat-card-subtitle>
                        </mat-card-header>
                        <img mat-card-image [src]="plugin.icon" alt="{{plugin['attribution']}}">
                    </mat-card>
                </div>
            </div>
            <button class="handle right-handle" (click)="onSlideClick('right')">
        <span class="w-5r bdrs-50p bdB pt-2" style="color: black;" aria-hidden="true">
          <i class="ti-angle-right"></i>
        </span>
            </button>
        </div>
    </div>
</div>
