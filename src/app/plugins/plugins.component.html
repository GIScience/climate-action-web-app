<div class="mX-5 p-10 bgc-white bd h-100p">
    <div class="row h-100p">
        <div class="plugin-header mx-3">
            <h3 class="plugin-title">Plugins</h3>
            <div class="progress-bar"></div>
        </div>
        <div class="plugin-container">
            <button class="handle left-handle" (click)="onSlideClick('left')">
        <span class="w-5r bdrs-50p bdB pt-2" style="color: black;" aria-hidden="true">
          <i class="ti-angle-left"></i>
        </span>
            </button>
            <div class="slider">
                <div class="card m-3 p-2" *ngFor="let card of plugins" style="cursor: pointer">
                    <img [src]="card.icon"
                         (click)="showPluginInfo(card.plugin_id)"
                         (keydown)="showPluginInfo(card.plugin_id)"
                         class="p-5 card-img-top card-tall-img shadow rounded-4"
                         alt="{{card['attribution']}}"
                         tabindex="0">
                    <div class="card-body">
                        <p (click)="showPluginInfo(card.plugin_id)"
                           (keydown)="showPluginInfo(card.plugin_id)"
                           class="card-title fsz-sm whs-nw ov-h tov-e"
                           tabindex="1">{{ card.name }}
                        </p>
                    </div>
                </div>
            </div>
            <button class="handle right-handle" (click)="onSlideClick('right')">
        <span class="w-5r bdrs-50p bdB pt-2" style="color: black;" aria-hidden="true">
          <i class="ti-angle-right"></i>
        </span>
            </button>
        </div>
    </div>
</div>
