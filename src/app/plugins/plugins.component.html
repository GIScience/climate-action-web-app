<div class="plugins-list">
    <h3 class="plugin-title"><mat-icon aria-hidden="true" aria-label="Plugins" fontIcon="extension"/> Plugins</h3>
    <ul>
        <li *ngFor="let card of cards; let i = index;" class="plugin-card {{card.enabled ? 'enabled-card' : 'disabled-card'}}" (click)="showPluginInfo(card); activateCard(card)" (keydown)="showPluginInfo(card); activateCard(card)" [ngClass]="{ 'plugin-card-highlight': activeCard === card }" tabindex="{{i}}" matTooltip="{{card.purpose}}" matTooltipPosition="right">
            <img [src]="card.image" alt="{{card.image_source}}">
            <div class="plugin-card__text">
                <h3>{{ card.name }}</h3>
                <span *ngIf="card.version && card.library_version">ver. {{ card.version }}/{{ card.library_version }}</span>
                <span *ngIf="!(card.version && card.library_version)">ver. 0.0.1/0.0.1</span>
            </div>
        </li>
    </ul>
</div>
