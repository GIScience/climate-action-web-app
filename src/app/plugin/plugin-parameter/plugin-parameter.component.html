<form [formGroup]="form" (ngSubmit)="onSubmit(model)">
    <div class="row">
        <!-- map -->
        <div class="col-12">
            <div id="map" style="height: 300px" class="bd"></div>
        </div>
    </div>
    <div class="row">
        <!-- json schema -->
        <formly-form [model]="model" [fields]="fields" [options]="options" [form]="form"></formly-form>
        <button type="submit" class="btn btn-default btn-outline-dark">Compute</button>
    </div>
</form>
