<div
    cdkDrag
    [cdkDragDisabled]="artifactViewerService.minimised"
    cdkDragBoundary=".dashboard__middle-column"
    [class.minimised]="artifactViewerService.minimised"
    class="artifact-container">
    <div cdkDragHandle class="artifact-header">
        <i-lucide [img]="GripHorizontal" size="15" class="grip-icon"></i-lucide>
        <h3 class="artifact-name">{{ artifactViewerService.name }}</h3>
        <button
            *ngIf="artifactService.currentUrl || artifactService.downloadJsonHref"
            (click)="downloadContent()"
            class="download-btn btn-onlyicon"
            [tp]="'artifactViewer.download' | transloco">
            <i-lucide [img]="Download" size="15"></i-lucide>
        </button>
        <div class="artifact-window-controls">
            <button
                (click)="toggleMinimise()"
                class="minimise-btn btn-onlyicon"
                [tp]="
                    artifactViewerService.minimised
                        ? ('artifactViewer.maximize' | transloco)
                        : ('artifactViewer.minimize' | transloco)
                ">
                <i-lucide
                    *ngIf="artifactViewerService.minimised; else minimizeIcon"
                    [img]="Maximize2"
                    size="15"></i-lucide>
                <ng-template #minimizeIcon>
                    <i-lucide [img]="Minimize2" size="15"></i-lucide>
                </ng-template>
            </button>
            <button
                (click)="closeArtifactViewer()"
                class="close-btn btn-onlyicon"
                [tp]="'artifactViewer.close' | transloco">
                <i-lucide [img]="X" size="15"></i-lucide>
            </button>
        </div>
    </div>
    <app-artifact></app-artifact>
</div>
