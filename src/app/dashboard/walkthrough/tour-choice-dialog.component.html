<div class="tour-choice-dialog">
    <h2>{{ 'walkthrough.tourChoiceDialog.title' | transloco }}</h2>
    <button (click)="closeDialog()" class="close-dialog">
        <i-lucide [img]="CircleX" size="25"></i-lucide>
    </button>

    <div class="dialog-content">
        <p>
            {{ 'walkthrough.tourChoiceDialog.description' | transloco }}
        </p>

        <div class="choice-buttons">
            <button class="btn-primary btn-withtext--after" (click)="onLoginClick()">
                <i-lucide [img]="LogIn" size="20"></i-lucide>
                {{ 'walkthrough.tourChoiceDialog.loginButton' | transloco }}
            </button>

            <button class="btn-alt btn-withtext--after" (click)="onGuestTourClick()">
                <i-lucide [img]="Play" size="20"></i-lucide>
                {{ 'walkthrough.tourChoiceDialog.guestTourButton' | transloco }}
            </button>
        </div>

        <p class="guest-tour-note">
            <small>{{ 'walkthrough.tourChoiceDialog.guestNote' | transloco }}</small>
        </p>
    </div>
</div>
