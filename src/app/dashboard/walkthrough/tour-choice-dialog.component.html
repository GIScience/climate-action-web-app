<div class="tour-choice-dialog">
    <h2>{{ 'walkthrough.tourChoiceDialog.title' | transloco }}</h2>
    <button type="button" (click)="closeDialog()" class="close-dialog">
        <svg lucideX size="25"></svg>
    </button>

    <p>{{ 'walkthrough.tourChoiceDialog.description' | transloco }}</p>

    <p class="guest-tour-note">
        <svg lucideInfo size="20"></svg>
        {{ 'walkthrough.tourChoiceDialog.guestNote' | transloco }}
    </p>

    <div class="choice-buttons">
        <button type="button" class="btn-primary btn-withtext--after" (click)="onLoginClick()">
            <svg lucideLogIn size="20"></svg>
            {{ 'walkthrough.tourChoiceDialog.loginButton' | transloco }}
        </button>

        <button type="button" class="btn-alt btn-withtext--after" (click)="onGuestTourClick()">
            <svg lucidePlay size="20"></svg>
            {{ 'walkthrough.tourChoiceDialog.guestTourButton' | transloco }}
        </button>
    </div>
</div>
