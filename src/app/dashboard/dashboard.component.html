<main class="dashboard">
    <div class="map-background" [attr.data-style]="mapService.styleChange$ | async"></div>
    <app-map></app-map>

    <div
        class="dashboard__left-column"
        [ngClass]="{ collapsed: leftColumnCollapsed, 'report-visible': isReportVisible }"
        (mouseenter)="onMouseEnterLeftColumn()"
        (mouseleave)="onMouseLeaveLeftColumn()">
        <router-outlet (activate)="onRouteActivate()"></router-outlet>
        @if (leftColumnCollapsible) {
            <button
                type="button"
                class="left-column-collapser"
                (click)="collapseLeftColumn()"
                [attr.aria-expanded]="!leftColumnCollapsed"
                [attr.aria-label]="
                    (leftColumnCollapsed ? 'dashboard.expandLeftColumn' : 'dashboard.collapseLeftColumn') | transloco
                "
                [tp]="(leftColumnCollapsed ? 'dashboard.expandLeftColumn' : 'dashboard.collapseLeftColumn') | transloco"
                tpPlacement="right">
                @if (leftColumnCollapsed) {
                    <svg lucidePanelLeftOpen size="18"></svg>
                } @else {
                    <svg lucidePanelLeftClose size="18"></svg>
                }
            </button>
        }
    </div>
    <div class="dashboard__middle-column">
        <app-artifact-viewer [hidden]="!artifactViewerService.isViewerVisible"></app-artifact-viewer>
    </div>
    <div class="dashboard__right-column">
        <app-search></app-search>
        <div #legendContainer></div>
    </div>
</main>

<app-report></app-report>
