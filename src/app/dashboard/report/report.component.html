<div cdkDrag [cdkDragDisabled]="minimised" cdkDragBoundary=".dashboard__middle-column" [class.minimised]="minimised" class="report-container">
    <div cdkDragHandle class="report-header">
        <i-lucide [img]="GripHorizontal" size="15" class="grip-icon"></i-lucide>
        <h3 class="report-name">{{ name }}</h3>
        <button *ngIf="currentUrl || downloadJsonHref" (click)="downloadContent()" class="download-btn btn-onlyicon" matTooltip="Download Report">
            <i-lucide [img]="Download" size="15"></i-lucide>
        </button>
        <div class="report-window-controls">
            <button (click)="toggleMinimise()" class="minimise-btn btn-onlyicon" [matTooltip]="minimised ? 'Maximise Report' : 'Minimise Report'">
                <i-lucide *ngIf="minimised; else minimizeIcon" [img]="Maximize2" size="15"></i-lucide>
                <ng-template #minimizeIcon>
                    <i-lucide [img]="Minimize2" size="15"></i-lucide>
                </ng-template>
            </button>
            <button (click)="reportService.closeReport()" class="close-btn btn-onlyicon" matTooltip="Close Report">
                <i-lucide [img]="X" size="15"></i-lucide>
            </button>
        </div>
    </div>
    <div class="report" id="report-page">
        <ng-scrollbar>
            <div *ngIf="showAccordion && modality === 'MARKDOWN'" class="report-meta">
                <mat-expansion-panel *ngIf="summary" class="report-abstract">
                    <mat-expansion-panel-header>
                        Abstract
                    </mat-expansion-panel-header>
                    {{ summary }}
                </mat-expansion-panel>
            </div>

            <div *ngIf="modality === 'TABLE'" class="report-meta">
                <p class="table-summary"><span>{{ summary }}</span></p>
            </div>

            <ng-container #container></ng-container>

            <div *ngIf="modality !== 'MARKDOWN'" class="report-meta">
                <p *ngIf="modality !== 'TABLE'" class="report-summary"><span>{{ summary }}</span></p>
                <div *ngIf="showAccordion">
                    <mat-expansion-panel *ngIf="description" class="report-description">
                        <mat-expansion-panel-header>
                            Detailed Description
                        </mat-expansion-panel-header>
                        <app-markdown [rawMarkdown]="description"></app-markdown>
                    </mat-expansion-panel>
                </div>
            </div>
        </ng-scrollbar>
    </div>
</div>
