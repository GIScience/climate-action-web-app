<div class="plugin-parameter-container">
    <div
        class="area-selection-message"
        [ngClass]="{
            'message--info': !user || !areaSelected,
            'message--blocked': user && areaSelected && this.mapService.selectedFeatures.getLength() > 1,
            'message--warning':
                user &&
                areaSelected &&
                this.mapService.selectedFeatures.getLength() === 1 &&
                this.mapService.selectedFeatures.item(0).get('area') > 500
        }"
        *ngIf="
            !user ||
            !areaSelected ||
            (areaSelected && this.mapService.selectedFeatures.getLength() > 1) ||
            (areaSelected &&
                this.mapService.selectedFeatures.getLength() === 1 &&
                this.mapService.selectedFeatures.item(0).get('area') > 500)
        ">
        <i-lucide
            [img]="
                !user
                    ? UserCheck
                    : !areaSelected
                      ? MapPinPlusInside
                      : this.mapService.selectedFeatures.getLength() > 1
                        ? TriangleAlert
                        : CircleAlert
            "
            size="20"></i-lucide>
        <span>
            <ng-container *ngIf="!user">Please login to continue.</ng-container>
            <ng-container *ngIf="user && !areaSelected">Select an area on the map to continue.</ng-container>
            <ng-container *ngIf="user && areaSelected && this.mapService.selectedFeatures.getLength() > 1"
                >Multiple areas selected. Please select only one.</ng-container
            >
            <ng-container
                *ngIf="
                    user &&
                    areaSelected &&
                    this.mapService.selectedFeatures.getLength() === 1 &&
                    this.mapService.selectedFeatures.item(0).get('area') > 500
                "
                >The selected region is large (> 500 km²).<br />Processing may take longer, or even fail.</ng-container
            >
        </span>
    </div>
    <div *ngIf="areaSelected" class="selected-regions">
        <div *ngFor="let region of this.mapService.selectedFeatures.getArray()" class="region-item">
            <span class="region-name">{{ region.get('name') }}</span>
            <span class="region-area">({{ region.get('area') }} km<sup>2</sup>)</span>
            <button class="deselect-region" (click)="deselectRegion(region)">×</button>
        </div>
    </div>
    <form [formGroup]="form" (ngSubmit)="onSubmit(model)">
        <div>
            <formly-form
                [model]="model"
                [fields]="fields"
                [options]="options"
                [form]="form"
                class="plugin-params-form"></formly-form>
            <div class="btn-container">
                <div matTooltip="Please login to request a computation." [matTooltipDisabled]="!!user">
                    <button
                        type="submit"
                        appearance="primary"
                        class="btn-primary btn-withtext"
                        [disabled]="!user || !form.valid || this.mapService.selectedFeatures.getLength() !== 1">
                        <i-lucide [img]="CirclePlay" size="20"></i-lucide>
                        Compute
                    </button>
                </div>
                <div
                    matTooltip="This plugin does not provide a demo."
                    [matTooltipDisabled]="this.plugin.demo_config !== null">
                    <button
                        type="button"
                        appearance="primary"
                        class="btn-primary btn-withtext"
                        (click)="runDemo()"
                        [disabled]="!this.plugin.demo_config">
                        <i-lucide [img]="Eye" size="20"></i-lucide>
                        Demo
                    </button>
                </div>
                <button type="button" class="btn-light btn-withtext" (click)="deactivateCompute()">Cancel</button>
            </div>
        </div>
    </form>
</div>
