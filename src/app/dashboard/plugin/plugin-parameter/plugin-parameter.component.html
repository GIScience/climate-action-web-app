<div class="plugin-parameter-container">
    <div *ngIf="!areaSelected" class="select-area-message">
        <i-lucide [img]="MapPinPlusInside" size="15"></i-lucide> <span>Select an area on the map to continue.</span>
    </div>
    <form [formGroup]="form" (ngSubmit)="onSubmit(model)">
        <div>
            <formly-form [model]="model" [fields]="fields" [options]="options" [form]="form" class="plugin-params-form"></formly-form>
            <button type="submit" appearance="primary" class="btn-primary btn-withtext" [disabled]="!form.valid"><i-lucide [img]="CirclePlay" size="20"></i-lucide> Compute</button>
        </div>
    </form>
</div>
