<ng-container *ngIf="(pluginObs$ | async) as plugin">
    <div class="plugin-name-wrapper" style="background-image: linear-gradient(225deg, rgb(207 217 223 / 65%) 0%, rgb(226, 235, 240) 85%), url('{{plugin.assets.icon}}')">
        <h1>{{ plugin.name }}</h1>
    </div>
    <div class="current-plugin" [ngClass]="pluginState">
        <h2>Compute</h2>
        <ng-scrollbar visibility="hover" orientation="vertical" externalViewport>
            <div class="plugin-content-wrapper" scrollViewport>
                <ul class="plugin-authors">
                    <li *ngFor="let author of plugin.authors">
                        <a rel="author" href="{{author.website}}" tp="Affiliated to {{ author.affiliation }}" target="_blank">{{ author.name }}</a>
                    </li>
                </ul> 
                <div class="plugin-content">
                    <div class="plugin__short-content">
                        <markdown [data]="extractFirstSentence(plugin.purpose)" ngPreserveWhitespaces class="markdown"></markdown>
                        <a class="read-more" (click)="openDialog(plugin)" (keyup.enter)="openDialog(plugin)" tabindex="0">Read more »</a>
                    </div>
                </div>
                <ng-container *ngIf="plugin?.operator_schema">
                    <app-plugin-parameter [schema]="plugin.operator_schema" [plugin]="plugin"></app-plugin-parameter>
                </ng-container>
            </div>
        </ng-scrollbar>
        <ng-template #pluginContentDialog let-data>
            <div class="plugin-content-dialog">
                <ng-scrollbar visibility="hover" orientation="vertical" externalViewport>
                    <div mat-dialog-content class="plugin__full-content" scrollViewport>
                        <h3>Purpose</h3>
                        <markdown [data]="plugin.purpose" ngPreserveWhitespaces class="markdown"></markdown>
                        <h3>Methodology</h3>
                        <markdown [data]="plugin.methodology" ngPreserveWhitespaces class="markdown"></markdown>
                        <div *ngIf="plugin.sources">
                            <h3>Sources</h3>
                            <ul class="plugin-sources">
                                <li *ngFor="let source of plugin.sources" class="plugin-sources">
                                    <strong *ngIf="source.title">{{ source.title }}</strong>
                                    {{ computeSourceText(source) }}{{ source.url ? "," : "" }}
                                    <a href="{{ source.url }}"
                                        target="_blank"
                                        rel="noopener noreferrer"
                                        *ngIf="source.url">{{ source.url }}</a>
                                </li>
                            </ul>
                        </div>
                    </div>
                </ng-scrollbar>
                <button mat-button (click)="closeDialog()" class="close-dialog"><i-lucide [img]="CircleX" size="30"></i-lucide></button>
            </div>
        </ng-template>
        <div class="new-compute-container">
            <button class="new-compute btn-alt btn-withtext" (click)="enableCompute()"><i-lucide [img]="RedoDot" size="20"></i-lucide> Do a new computation</button>
        </div>
    </div>
    <div class="artifacts-list">
        <app-artifacts></app-artifacts>
    </div>
</ng-container>
