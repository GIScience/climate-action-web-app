<div class="plugin-container">
    <div *ngIf="loading">
        <div class="plugin-header is-loading">
            <h1>Loading...</h1>
        </div>
        <div class="plugin-content-wrapper is-loading">
            <h2>Loading...</h2>
        </div>
    </div>

    <ng-container *ngIf="pluginObs$ | async as plugin">
        <div *ngIf="!loading">
            <div class="plugin-header">
                <div class="plugin-name-wrapper">
                    <h1>{{ plugin.name }}</h1>
                    <a
                        *ngIf="plugin.state && plugin.state !== 'active'"
                        href="https://github.com/GIScience/badges#{{ plugin.state }}"
                        target="_blank">
                        <img
                            src="https://github.com/GIScience/badges/raw/master/status/{{ plugin.state }}.svg"
                            alt="Assesment Tool Development State"
                            class="plugin-state-badge" />
                    </a>
                    <i-lucide
                        [img]="CloudOff"
                        size="25"
                        color="#ff7800"
                        *ngIf="plugin.status === 'unavailable'"
                        tp="This plugin is currently offline. Previous computations are still available."
                        tpPlacement="bottom"></i-lucide>
                </div>
                <div class="plugin-meta">
                    <div class="plugin-purpose">
                        <markdown
                            [data]="isPurposeExpanded ? plugin.purpose : shortPurpose"
                            ngPreserveWhitespaces
                            class="markdown"></markdown>
                        <div class="read-more-wrapper">
                            <a
                                class="read-more"
                                (click)="togglePurposeExpand()"
                                (keyup.enter)="togglePurposeExpand()"
                                tabindex="0"
                                >{{ isPurposeExpanded ? 'Show less' : 'Read more' }}
                                <i-lucide [img]="isPurposeExpanded ? ChevronsUp : ChevronsDown" size="15"></i-lucide>
                            </a>
                        </div>
                    </div>
                    <div class="plugin-links-container" [@accordion]="isPurposeExpanded ? 'expanded' : 'collapsed'">
                        <div class="methodology-link__wrapper">
                            <button
                                class="btn-light btn-small btn-withtext"
                                (click)="openDialog(plugin)"
                                (keyup.enter)="openDialog(plugin)"
                                tabindex="0">
                                Read about the methodology »
                            </button>
                        </div>
                        <div class="credits-link__wrapper" *ngIf="plugin.authors.length > 0">
                            <button
                                class="btn-light btn-small btn-withtext"
                                (click)="openCreditsDialog(plugin)"
                                (keyup.enter)="openCreditsDialog(plugin)"
                                tabindex="0">
                                View credits »
                            </button>
                        </div>
                    </div>
                </div>
            </div>

            <div class="plugin-content-wrapper">
                <div class="computations-list" *ngIf="plugin.status === 'unavailable' || computeState === 'inactive'">
                    <div class="computations-list__header">
                        <h2>Computations</h2>
                        <div
                            class="new-compute__wrapper"
                            *ngIf="plugin.status !== 'unavailable'"
                            tp="Please login to request a computation."
                            [tpIsEnabled]="!user">
                            <button
                                class="new-compute btn-primary btn-small btn-withtext"
                                (click)="enterComputeState()"
                                [disabled]="!user">
                                <i-lucide [img]="DiamondPlus" size="20"></i-lucide>
                                New computation
                            </button>
                        </div>
                    </div>
                    <app-computations-index></app-computations-index>
                </div>

                <div class="plugin-compute" *ngIf="plugin.status !== 'unavailable' && computeState === 'compute-ready'">
                    <div class="plugin-compute__header">
                        <h2>Compute</h2>
                        <button
                            class="new-compute btn-light btn-small btn-withtext"
                            (click)="exitComputeState()"
                            [disabled]="!user">
                            <i-lucide [img]="CircleX" size="20"></i-lucide>
                            Cancel
                        </button>
                    </div>
                    <div class="plugin-compute-wrapper">
                        <ng-container *ngIf="plugin?.operator_schema">
                            <app-plugin-parameter
                                [schema]="plugin.operator_schema"
                                [plugin]="plugin"></app-plugin-parameter>
                        </ng-container>
                    </div>
                </div>
            </div>
        </div>
    </ng-container>
</div>

<ng-template #pluginMethodologyDialog let-data>
    <div class="plugin-methodology-dialog">
        <ng-scrollbar visibility="hover" orientation="vertical">
            <h2>Methodology</h2>
            <markdown [data]="data.methodology" ngPreserveWhitespaces class="markdown"></markdown>
            <div *ngIf="data.sources">
                <h3>Sources</h3>
                <ul class="plugin-sources">
                    <li *ngFor="let source of data.sources" class="plugin-sources">
                        <strong *ngIf="source.title">{{ source.title }}</strong>
                        {{ processSourceText(source) }}{{ source.url ? ',' : '' }}
                        <a href="{{ source.url }}" target="_blank" rel="noopener noreferrer" *ngIf="source.url">{{
                            source.url
                        }}</a>
                    </li>
                </ul>
            </div>
        </ng-scrollbar>
        <button (click)="closeDialog()" class="close-dialog">
            <i-lucide [img]="CircleX" size="25"></i-lucide>
        </button>
    </div>
</ng-template>

<ng-template #pluginCreditsDialog let-data>
    <div class="plugin-credits-dialog">
        <ng-scrollbar visibility="hover" orientation="vertical">
            <h2>Credits</h2>
            <ul class="plugin-authors">
                <li *ngFor="let author of data.authors">
                    <a
                        rel="author"
                        href="{{ author.website }}"
                        tp="Affiliated to {{ author.affiliation }}"
                        target="_blank"
                        >{{ author.name }}</a
                    >
                </li>
            </ul>
        </ng-scrollbar>
        <button (click)="closeDialog()" class="close-dialog">
            <i-lucide [img]="CircleX" size="25"></i-lucide>
        </button>
    </div>
</ng-template>
