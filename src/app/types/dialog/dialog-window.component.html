<div class="dialog-window">
    <h2>{{ data.props?.label | transloco }}</h2>
    <button (click)="closeDialog()" class="close-dialog">
        <i-lucide [img]="CircleX" size="25"></i-lucide>
    </button>
    <ng-scrollbar orientation="vertical">
        <div class="optional-attributes">
            @if (data.props?.description) {
                <p>{{ data.props?.description | transloco }}</p>
            }
            <formly-field [field]="data"></formly-field>
        </div>
    </ng-scrollbar>
    <div class="dialog-window-buttons">
        <button (click)="saveDialog()" class="btn-alt btn-withtext--after">{{ 'dialog.save' | transloco }}</button>
        <button (click)="resetDialog()" class="btn-light btn-withtext--after">{{ 'dialog.reset' | transloco }}</button>
    </div>
</div>
