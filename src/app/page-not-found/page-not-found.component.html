<div class="page-not-found">
    <div class="error-code">
        <span class="digit">4</span>
        <div class="portal">
            <div class="stars-window"></div>
        </div>
        <span class="digit">4</span>

    <p class="message">{{ 'pageNotFound.message' | transloco }}</p>

        {{ 'pageNotFound.returnToDashboard' | transloco }}
    </button>
</div>
